name: Erratum
description: Report a mistake in one of the books — a wrong formula, proof, solution, figure or typo.
title: "[Erratum] "
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Errata are the most valuable contribution the books receive —
        fixes usually ship in the next release, within days.
  - type: dropdown
    id: book
    attributes:
      label: Book
      options:
        - "1 — Primary & Middle School (Grades 1–9)"
        - "2 — High School (Grades 10–12)"
        - "3 — University Year 1"
        - "4 — University Year 2"
        - "5 — University Year 3"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Edition
      options:
        - English
        - French
        - Dutch
        - Spanish
        - Portuguese
        - Hindi
      default: 0
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where
      description: >
        Chapter and page, plus the version from the title page (e.g. v0.0.16) —
        or the URL of the online chapter.
      placeholder: "Chapter 14 (Trigonometry), page 89, v0.0.16"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Quote the current text or formula, and say what you believe it should be.
    validations:
      required: true
